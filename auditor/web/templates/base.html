<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Therefore Log Auditor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <a href="/">Therefore Log Auditor</a>
    {% if user %}
    <a href="/admin/tenants" style="margin-left:16px;font-weight:400">Tenants</a>
    <a href="/admin/smtp" style="margin-left:16px;font-weight:400">SMTP</a>
    <a href="/admin/users" style="margin-left:16px;font-weight:400">Accounts</a>
    {% endif %}
  </div>
  {% if user %}
  <span class="user">{{ user.username }}
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
  </span>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
