<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Therefore Log Auditor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a href="/">Therefore Log Auditor</a>
  {% if user %}
  <span class="user">{{ user.username }}
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
  </span>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
